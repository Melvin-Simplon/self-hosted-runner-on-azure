[defaults]
inventory = inventories/azure/hosts.yml
# Sudo account created by Terraform, reserved to Ansible
remote_user = ansible
# Workstation default; the CI overrides it with ANSIBLE_PRIVATE_KEY_FILE
private_key_file = ~/.ssh/runner-azure-ansible
interpreter_python = auto_silent
# Time spent per task, useful to spot the slow ones
callbacks_enabled = ansible.posix.profile_tasks

[ssh_connection]
# The VM is destroyed and recreated on demand, so its host key changes every time:
# accept it without storing it, otherwise the next VM would be rejected as an impostor.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/dev/null
# Fewer SSH round trips per task
pipelining = True
