---
# Unprivileged account that runs the CI jobs: no sudo, no login shell
github_runner_user: github-runner
# Runner install dir, also the home of github_runner_user (the job cache lives here)
github_runner_dir: /opt/actions-runner

# Latest release: https://github.com/actions/runner/releases
# Change both together: the checksum protects against a tampered archive
github_runner_version: "2.337.0"
github_runner_sha256: 70920811a4f8ad4328818682bca5c6469c1c942fab52448868071d0063816613
# Where the runner registers, from GITHUB_RUNNER_URL (.env or CI variable):
# https://github.com/<org> serves every repository of the org, https://github.com/<owner>/<repo> one repository
github_runner_url: "{{ lookup('ansible.builtin.env', 'GITHUB_RUNNER_URL') }}"
# Unique per VM: several people can register their VM in the same org, and --replace
# only ever takes over an entry left by this same VM, never the runner of someone else
github_runner_name: "{{ inventory_hostname }}-{{ ansible_facts['machine_id'][:8] }}"
# Registration token (valid 1 hour), read from the environment so it is never stored in the repo.
# Empty once the runner is registered: the register task is skipped and does not need it.
github_runner_token: "{{ lookup('ansible.builtin.env', 'GITHUB_RUNNER_TOKEN') }}"
